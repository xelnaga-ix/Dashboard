<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mätuppföljning 2026</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed; --border:rgba(11,11,11,.10);
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.12);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s-none:#a8a7a1;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --track:#e7e6e1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --border:rgba(255,255,255,.10);
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-none:#6b6a66;
    --good-text:#0ca30c; --track:#2c2c2a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --border:rgba(255,255,255,.10);
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s-none:#6b6a66;
  --good-text:#0ca30c; --track:#2c2c2a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--border)}
.top-in{max-width:1400px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.title h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.title .sub{color:var(--ink-2);font-size:12.5px}
.live{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:12.5px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px;vertical-align:1px}
.dot.on{background:var(--good);box-shadow:0 0 0 3px rgba(12,163,12,.18)}
.dot.err{background:var(--crit)}
button,.btn{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--surface-2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 0 6px}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flabel{font-size:12px;color:var(--muted);margin-right:2px;text-transform:uppercase;letter-spacing:.04em}
.chip{border-radius:999px;padding:5px 11px;font-size:13px;background:var(--surface);border:1px solid var(--border);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 8px}
.range-note{color:var(--ink-2);font-size:13px;padding:2px 0 10px}
section{margin-top:18px}
h2{font-size:15px;margin:0 0 10px;font-weight:650}
h2 .h-sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .lbl{color:var(--ink-2);font-size:12.5px}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.kpi .val small{font-size:14px;color:var(--ink-2);font-weight:500;margin-left:3px}
.kpi .foot{color:var(--muted);font-size:12px;margin-top:2px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.bigbar{height:14px;border-radius:7px;background:var(--track);overflow:hidden;display:flex;margin:12px 0 8px}
.bigbar span{display:block;height:100%}
.hero .num{font-size:34px;font-weight:700;letter-spacing:-.02em}
.hero .num small{font-size:16px;color:var(--ink-2);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:6px}
.stat .l{color:var(--ink-2);font-size:12.5px}.stat .v{font-size:18px;font-weight:650}
.stat .v.ok{color:var(--good-text)} .stat .v.bad{color:var(--crit)}
.chartbox{position:relative;height:300px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:12px;background:var(--surface);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tr.total td{font-weight:650;background:var(--surface-2)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.detail td{background:var(--surface-2);white-space:normal;padding:0}
.inner{padding:8px 12px 12px}
.inner table{background:var(--surface);border:1px solid var(--border);border-radius:8px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.vcard h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.vcard .reg{color:var(--muted);font-weight:400;font-size:12.5px}
.vcard .big{font-size:28px;font-weight:700;margin:8px 0 2px;letter-spacing:-.02em}
.vcard .big small{font-size:14px;color:var(--ink-2);font-weight:500}
.vcard dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0 0;font-size:13px}
.vcard dt{color:var(--ink-2)} .vcard dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:2px;height:36px;margin-top:10px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:1px;background:var(--track)}
.ord-county{margin-bottom:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,auto);gap:4px 16px;padding:9px 12px;border-top:1px solid var(--grid);align-items:center}
.prow:first-child{border-top:none}
.prow .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm .tag{font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 4px;color:var(--ink-2);margin-left:6px}
.prow .fig{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.prow .fig b{color:var(--ink)} .prow .fig span{color:var(--muted)}
.pbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:12px 12px 0 0;font-weight:650}
.chead .fig{font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .tr{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bc,var(--muted))}
.b-measured{--bc:var(--good)} .b-dev{--bc:var(--crit)} .b-plan{--bc:var(--muted)} .b-fixed{--bc:var(--good)} .b-open{--bc:var(--serious)}
.banner{margin-top:12px;padding:10px 14px;border-radius:10px;border:1px solid var(--warn);background:rgba(250,178,25,.10);font-size:13px}
.banner.err{border-color:var(--crit);background:rgba(208,59,59,.10)}
.loading{padding:60px 0;text-align:center;color:var(--ink-2)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar h2{margin:0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 10px;font-size:13px;color:var(--ink-2);background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.empty{color:var(--muted);padding:18px;text-align:center}
footer{color:var(--muted);font-size:12px;margin-top:28px;line-height:1.6}
@media (max-width:600px){.prow{grid-template-columns:1fr}.prow .fig{text-align:left}.hbar{grid-template-columns:110px 1fr 60px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="title"><h1 id="ttl">Mätuppföljning</h1><div class="sub" id="subttl">Road Plan 2026 · läser direkt från Balder</div></div>
  <div class="live">
    <span id="liveState"><span class="dot"></span>Ansluter…</span>
    <span id="updated"></span>
    <button id="refreshBtn" title="Hämta om all data">Uppdatera</button>
    <button id="themeBtn" title="Byt ljust/mörkt läge" aria-label="Byt tema">Ljust/mörkt</button>
  </div>
</div></header>

<div class="wrap">
  <div id="banners"></div>
  <div class="filters" id="filters">
    <div class="fgroup" id="periodChips"><span class="flabel">Period</span></div>
    <div class="fgroup" id="customRange" hidden>
      <input type="date" id="dFrom" aria-label="Från datum"> – <input type="date" id="dTo" aria-label="Till datum">
    </div>
    <div class="fgroup" id="vehChips"><span class="flabel">Bilar</span></div>
  </div>
  <div class="range-note" id="rangeNote"></div>

  <div id="app"><div class="loading">Hämtar data från Supabase…</div></div>

  <footer id="foot"></footer>
</div>

function weekStart(s){ const d=parseD(s); const wd=(d.getDay()+6)%7; return ymd(addDays(d,-wd)); }

const H = {apikey:CFG.key, Authorization:"Bearer "+CFG.key};
async function rest(path, range){
  const h = Object.assign({}, H); if(range) { h.Range=range; h["Range-Unit"]="items"; }

  return r.json();
}
async function restAll(path){ // PostgREST levererar max 1000 rader per anrop → bläddra
  let out=[], from=0;
  for(;;){ const page=await rest(path,from+"-"+(from+999)); out=out.concat(page); if(page.length<1000) break; from+=1000; }
  return out;
}

// ───────────────────────── Orderindex (från XML-beställningarna) ─────────────────────────
const OI = window.ORDER_INDEX;
const ORDERS = OI.orders.map((o,i)=>({i,name:o[0],id:o[1],mt:o[2],lan:o[3],total:o[4],n:o[5],slut:o[6],km:o[2]===21}));
const ORDER_BY_ID = new Map(ORDERS.map(o=>[o.id,o.i]));
const EXACT = new Map(), IVL = new Map();
OI.keys.forEach((str,i)=>{ const mt=ORDERS[i].mt; for(const k of str.split(" ")){ if(!k) continue;
  const ek=k+"|"+mt; (EXACT.get(ek)||EXACT.set(ek,[]).get(ek)).push(i);
  const p=k.split("_"); const ik=p[0]+"_"+p[1]+"_"+p[2]+"|"+mt; (IVL.get(ik)||IVL.set(ik,[]).get(ik)).push([+p[3],+p[4],i]); } });
const SEASON_END = ORDERS.reduce((a,o)=>o.slut>a?o.slut:a,"");

function orderCandidates(sid, rsById){
  const rs = rsById.get(sid);
  if(rs && rs.best && ORDER_BY_ID.has(rs.best)) return [ORDER_BY_ID.get(rs.best)];
  let p = String(sid).split("_"); let mts=[20,21];
  if(p.length===6 && /^MT\d+$/.test(p[5])){ mts=[+p[5].slice(2)]; p=p.slice(0,5); }
  if(p.length!==5) return [];
  const key=p.join("_");
  for(const m of mts){ const e=EXACT.get(key+"|"+m); if(e) return [...new Set(e)]; }
  const a=+p[3], b=+p[4]; if(!isFinite(a)||!isFinite(b)) return [];
  const lo=Math.min(a,b), hi=Math.max(a,b), base=p[0]+"_"+p[1]+"_"+p[2];
  for(const m of mts){ const c=new Set(); for(const [x,y,i] of (IVL.get(base+"|"+m)||[])) if(x-2<=lo && hi<=y+2) c.add(i); if(c.size) return [...c]; }
  for(const m of mts){ const c=new Set(); for(const [x,y,i] of (IVL.get(base+"|"+m)||[])) if(x<hi && lo<y) c.add(i); if(c.size) return [...c]; }
  return [];
}

function buildModel(R){
  const rsById=new Map();
  for(const r of R.rsegs){ let p=r.properties; if(typeof p==="string"){ try{p=JSON.parse(p);}catch(e){p={};} } p=p||{};
    rsById.set(r.id,{best:p.bestallning_id||null, sc:p.self_control===true}); }
  const vehById=new Map(R.vehicles.map(v=>[v.id,v]));
  const wdById=new Map(R.wds.map(w=>[w.id,w]));
  const faultById=new Map(R.faults.map(f=>[f.id,f]));
  // fordon: sorterade på namn → fasta färgplatser
  const vlist = R.vehicles.slice().sort((a,b)=>a.name.localeCompare(b.name,"sv",{numeric:true}))
    .map((v,i)=>({key:v.id,name:v.name,reg:(v.registration&&v.registration!==v.name)?v.registration:"",color:SLOTS[i%SLOTS.length]}));
  const hasNone = R.wds.some(w=>w.date && !vehById.has(w.vehicle_id));
  if(hasNone) vlist.push({key:"none",name:"Ej tilldelad",reg:"",color:"--s-none"});
  const vehMap=new Map(vlist.map(v=>[v.key,v]));

  // rader
  const segsByWd=new Map();
  const rows = R.segs.map(s=>{ const w=wdById.get(s.work_day_id)||{}; const r={
      id:s.id, wd:s.work_day_id, sid:s.segment_id, st:s.status, len:+s.segment_length_m||0,
      date:w.date||null, veh: vehById.has(w.vehicle_id)?w.vehicle_id:"none",
      fault:s.fault_code_id?faultById.get(s.fault_code_id):null, note:s.deviation_notes||s.skip_reason||"", seq:s.sequence_order||0,
      sc:(rsById.get(s.segment_id)||{}).sc||false, cand:orderCandidates(s.segment_id,rsById), order:null };
    (segsByWd.get(r.wd)||segsByWd.set(r.wd,[]).get(r.wd)).push(r); return r; });
  // tvetydiga sträckor (samma vägnummer i flera län) → välj den order som dominerar samma arbetsdag
  for(const r of rows){
    if(r.cand.length===1){ r.order=r.cand[0]; continue; }
    if(!r.cand.length) continue;
    const cnt=new Map(); for(const t of segsByWd.get(r.wd)) if(t.cand.length===1) cnt.set(t.cand[0],(cnt.get(t.cand[0])||0)+1);
    r.order = r.cand.slice().sort((a,b)=>(cnt.get(b)||0)-(cnt.get(a)||0)||a-b)[0];
  }
  // unika sträckor för orderframsteg
  const segAgg=new Map();
  for(const r of rows){ let a=segAgg.get(r.sid); if(!a){ a={sid:r.sid,len:0,order:r.order,sc:r.sc,measured:false,mDate:null,dev:false,planned:false,pDate:null}; segAgg.set(r.sid,a); }
    a.len=Math.max(a.len,r.len); if(a.order==null) a.order=r.order;
    if(MEASURED.has(r.st)){ a.measured=true; if(r.date && (!a.mDate||r.date<a.mDate)) a.mDate=r.date; }
    else if(r.st==="deviated") a.dev=true;
    else if(r.st==="planned"){ a.planned=true; if(r.date && (!a.pDate||r.date<a.pDate)) a.pDate=r.date; }
  }
  const ordStats = ORDERS.map(o=>({o,meas:0,scheduled:0,pool:0,devOpen:0,inPlan:0}));
  let unknownLen=0;
  for(const a of segAgg.values()){
    if(a.sc) continue;
    if(a.order==null){ if(a.measured) unknownLen+=a.len; continue; }
    const s=ordStats[a.order]; s.inPlan+=a.len;
    if(a.measured) s.meas+=a.len;
    else { if(a.dev) s.devOpen+=a.len; if(a.pDate) s.scheduled+=a.len; else s.pool+=a.len; }
  }
  // orderfiler i Balder som inte finns i inbäddat index
  const known=new Set(ORDERS.map(o=>o.id));
  const newFiles = R.files.filter(f=>{ const m=/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.xml$/i.exec(f.filename||""); return m && !known.has(m[1]); });
  const dates = rows.filter(r=>r.date).map(r=>r.date).sort();
  return {rows, wdById, vehMap, vlist, segAgg, ordStats, unknownLen, newFiles, faultById, firstDate:dates[0]||todayStr(), lastDate:dates[dates.length-1]||todayStr()};
}

// ───────────────────────── Filterläge ─────────────────────────
const PERIODS = [
  {k:"today",l:"Idag"},{k:"yesterday",l:"Igår"},{k:"week",l:"Denna vecka"},{k:"lastweek",l:"Förra veckan"},
  {k:"month",l:"Denna månad"},{k:"lastmonth",l:"Förra månaden"},{k:"30d",l:"30 dagar"},{k:"season",l:"Hela säsongen"},{k:"custom",l:"Anpassad"}];
const S = { period: recall("period","week"), from:null, to:null, gran: recall("gran","day"), veh: new Set(recall("veh",[])) };
function periodRange(){
  const t=new Date(); const T=ymd(t);
  switch(S.period){
    case "today": return [T,T];
    case "yesterday": { const y=ymd(addDays(t,-1)); return [y,y]; }
    case "week": return [weekStart(T),T];
    case "lastweek": { const ws=parseD(weekStart(T)); return [ymd(addDays(ws,-7)),ymd(addDays(ws,-1))]; }
    case "month": return [T.slice(0,8)+"01",T];
    case "lastmonth": { const d=new Date(t.getFullYear(),t.getMonth()-1,1); const e=new Date(t.getFullYear(),t.getMonth(),0); return [ymd(d),ymd(e)]; }
    case "30d": return [ymd(addDays(t,-29)),T];
    case "season": return [M?M.firstDate:"2026-05-01", T];
    case "custom": return [S.from||weekStart(T), S.to||T];
  }
  return [T,T];
}
const vehOn = k => S.veh.size===0 || S.veh.has(k);

function buildFilters(){
  const pc=$("#periodChips"); pc.querySelectorAll(".chip").forEach(c=>c.remove());
  for(const p of PERIODS){ const b=document.createElement("button"); b.className="chip"; b.textContent=p.l; b.setAttribute("aria-pressed",S.period===p.k);
    b.onclick=()=>{ S.period=p.k; store("period",p.k); if(p.k==="custom"){ const [f,t]=periodRange(); S.from=f; S.to=t; } buildFilters(); render(); }; pc.appendChild(b); }
  $("#customRange").hidden = S.period!=="custom";
  if(S.period==="custom"){ const [f,t]=periodRange(); $("#dFrom").value=f; $("#dTo").value=t; }
  const vc=$("#vehChips"); vc.querySelectorAll(".chip").forEach(c=>c.remove());
  if(!M) return;
  const all=document.createElement("button"); all.className="chip"; all.textContent="Alla"; all.setAttribute("aria-pressed",S.veh.size===0);
  all.onclick=()=>{ S.veh.clear(); store("veh",[]); buildFilters(); render(); }; vc.appendChild(all);
  for(const v of M.vlist){ const b=document.createElement("button"); b.className="chip"; b.setAttribute("aria-pressed",S.veh.has(v.key));
    b.innerHTML=`<i class="sw" style="background:var(${v.color})"></i>${esc(v.name)}`;
    b.onclick=()=>{ S.veh.has(v.key)?S.veh.delete(v.key):S.veh.add(v.key); if(S.veh.size===M.vlist.length) S.veh.clear(); store("veh",[...S.veh]); buildFilters(); render(); };
    vc.appendChild(b); }
}
$("#dFrom").onchange=e=>{ S.from=e.target.value; render(); };
$("#dTo").onchange=e=>{ S.to=e.target.value; render(); };

// ───────────────────────── Rendering ─────────────────────────
let charts=[], mountQ=[];
function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  renderBanners();
  if(!M){ if(loadErr) $("#app").innerHTML=`<div class="banner err">Kunde inte läsa data: ${esc(loadErr.message)}</div>`; return; }
  const [from,to]=periodRange();
  const days=Math.round((parseD(to)-parseD(from))/864e5)+1;
  $("#rangeNote").textContent = (from===to? fmtDate(from) : fmtDate(from)+" – "+fmtDate(to)+" ("+days+" dagar)") + (S.veh.size? " · "+[...S.veh].map(k=>M.vehMap.get(k)?.name).join(", ") : " · alla bilar");
  const inP = r => r.date && r.date>=from && r.date<=to && vehOn(r.veh);
  const P = M.rows.filter(inP);
  const app=$("#app"); app.innerHTML="";
  app.append(secSeason(), secKpis(P,from,to), secProduction(P,from,to), secVehicles(P,from,to), secDayLog(P), secOrders(P), secDeviations(P), secAhead());
  if(RAW.replan && RAW.replan.length) app.append(secReplan(from,to));
  const q=mountQ; mountQ=[]; q.forEach(f=>f());
  $("#foot").innerHTML = `Data: Supabase-projektet för Balder, projekt ”${esc(CFG.project)}”. Uppmätt = status körd, paus granskad, bearbetad eller klar. Bilarnas produktion räknas per arbetsdag (en sträcka som mätts om räknas igen den dagen). Orderframsteget räknar varje unik sträcka en gång och exkluderar egenkontrollsträckor. Ordertotaler kommer från beställnings-XML:erna (${ORDERS.length} filer, version ${esc(OI.v)}); en mätsträcka med flera körfält räknas en gång per körfält.`;
}

function renderBanners(){
  const b=$("#banners"); let h="";
  if(loadErr && M) h+=`<div class="banner err">Senaste uppdateringen misslyckades (${esc(loadErr.message)}). Visar data från ${lastLoad?lastLoad.toLocaleTimeString("sv-SE"):"–"}.</div>`;
  if(M && M.newFiles.length) h+=`<div class="banner">Balder har ${M.newFiles.length} orderfil(er) som inte finns i appens orderindex (${M.newFiles.map(f=>esc(f.filename)).join(", ")}). Ordertotalerna för dessa saknas tills orderindexet byggs om.</div>`;
  if(M && M.unknownLen>0) h+=`<div class="banner">${km(M.unknownLen)} km uppmätta sträckor kunde inte kopplas till någon order.</div>`;
  b.innerHTML=h;
}

function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }

function secSeason(){
  const tot=ORDERS.reduce((a,o)=>a+o.total,0);
  let meas=0, sched=0, pool=0, dev=0;
  for(const s of M.ordStats){ meas+=Math.min(s.meas,s.o.total); }
  for(const s of M.ordStats){ sched+=s.scheduled; pool+=s.pool; dev+=s.devOpen; }
  const remain=Math.max(0,tot-meas);
  // tempo: senaste 14 dagarna (alla bilar)
  const T=todayStr(); const f14=ymd(addDays(new Date(),-13));
  const last14=M.rows.filter(r=>MEASURED.has(r.st)&&r.date&&r.date>=f14&&r.date<=T).reduce((a,r)=>a+r.len,0);
  const pace=last14/14;
  const daysLeft=Math.max(0,Math.round((parseD(SEASON_END)-parseD(T))/864e5));
  const need=daysLeft>0?remain/daysLeft:remain;
  const eta = pace>0 ? ymd(addDays(new Date(),Math.ceil(remain/pace))) : null;
  const pm=100*meas/tot, ps=100*Math.min(sched,remain)/tot, pp=100*Math.min(pool,Math.max(0,remain-sched))/tot;
  return el(`<section><div class="hero">
   <div class="card">
     <div class="ink2" style="font-size:13px">Säsongen totalt · alla beställningar</div>
     <div class="num">${km0(meas)} <small>av ${km0(tot)} km uppmätt</small></div>
     <div class="bigbar" role="img" aria-label="${pct(meas,tot)} uppmätt">
       <span style="width:${pm}%;background:var(--good)"></span>
       <span style="width:${ps}%;background:var(--accent);opacity:.55"></span>
       <span style="width:${pp}%;background:var(--muted);opacity:.45"></span>
     </div>
     <div class="legend">
       <span><i class="sw" style="background:var(--good)"></i>Uppmätt ${pct(meas,tot)}</span>
       <span><i class="sw" style="background:var(--accent);opacity:.55"></i>Inplanerat datum ${km0(sched)} km</span>
       <span><i class="sw" style="background:var(--muted);opacity:.45"></i>I pool utan datum ${km0(pool)} km</span>
       <span>Ej planerat ${km0(Math.max(0,remain-sched-pool))} km</span>
     </div>
   </div>
   <div class="card">
     <div class="ink2" style="font-size:13px">Prognos mot slutdatum ${fmtDate(SEASON_END)}</div>
     <div class="statgrid">
       <div class="stat"><div class="l">Kvar att mäta</div><div class="v">${km0(remain)} km</div></div>
       <div class="stat"><div class="l">Dagar kvar</div><div class="v">${daysLeft}</div></div>
       <div class="stat"><div class="l">Behövs per dag</div><div class="v">${km0(need)} km</div></div>
       <div class="stat"><div class="l">Tempo senaste 14 d</div><div class="v ${pace>=need?"ok":"bad"}">${km0(pace)} km/dag</div></div>
       <div class="stat" style="grid-column:1/-1"><div class="l">Klart med nuvarande tempo</div><div class="v ${eta&&eta<=SEASON_END?"ok":"bad"}">${eta?fmtDate(eta)+" "+eta.slice(0,4):"–"}${eta&&eta>SEASON_END?" · "+Math.round((parseD(eta)-parseD(SEASON_END))/864e5)+" dagar efter":""}</div></div>
     </div>
   </div></div></section>`);
}

function secKpis(P,from,to){
  const m=P.filter(r=>MEASURED.has(r.st));
  const kmM=m.reduce((a,r)=>a+r.len,0);
  const vdays=new Set(m.map(r=>r.veh+"|"+r.date)).size;
  const dev=P.filter(r=>r.st==="deviated");
  const plannedLeft=P.filter(r=>r.st==="planned").reduce((a,r)=>a+r.len,0);
  const planAll=P.filter(r=>r.st!=="skipped").reduce((a,r)=>a+r.len,0);
  return el(`<section><div class="grid-kpi">
    <div class="card kpi"><div class="lbl">Uppmätt i perioden</div><div class="val">${km(kmM)}<small>km</small></div><div class="foot">${m.length} sträckor</div></div>
    <div class="card kpi"><div class="lbl">Mätdagar (bil × dag)</div><div class="val">${vdays}</div><div class="foot">dagar med uppmätt sträcka</div></div>
    <div class="card kpi"><div class="lbl">Snitt per mätdag</div><div class="val">${vdays?km(kmM/vdays):"–"}<small>km</small></div><div class="foot">per bil och dag</div></div>
    <div class="card kpi"><div class="lbl">Utfört av planerat</div><div class="val">${planAll?nf0.format(100*kmM/planAll)+" %":"–"}</div><div class="foot">${km(plannedLeft)} km ej körda i perioden</div></div>
    <div class="card kpi"><div class="lbl">Avvikelser</div><div class="val">${dev.length}</div><div class="foot">${km(dev.reduce((a,r)=>a+r.len,0))} km behöver mätas om</div></div>
  </div></section>`);
}

function buckets(from,to,g){ const out=[]; const seen=new Set(); for(let d=parseD(from); ymd(d)<=to; d=addDays(d,1)){ const k=bucketKey(ymd(d),g); if(!seen.has(k)){ seen.add(k); out.push(k);} } return out; }

function secProduction(P,from,to){
  const sec=el(`<section><div class="toolbar"><h2>Produktion per bil<span class="h-sub">uppmätta km</span></h2>
    <div class="seg" role="group" aria-label="Upplösning">${[["day","Dag"],["week","Vecka"],["month","Månad"]].map(([k,l])=>`<button data-g="${k}" aria-pressed="${S.gran===k}">${l}</button>`).join("")}</div></div>
    <div class="card"><div class="chartbox"><canvas aria-label="Uppmätta km per bil och period"></canvas></div></div>
    <div class="tbl-wrap" style="margin-top:12px"></div></section>`);
  sec.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ S.gran=b.dataset.g; store("gran",S.gran); render(); });
  let g=S.gran; let keys=buckets(from,to,g);
  if(g==="day" && keys.length>120){ g="week"; keys=buckets(from,to,g); sec.querySelector(".h-sub").textContent="uppmätta km · visas per vecka (för många dagar)"; }
  sec.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===g));
  const vs=M.vlist.filter(v=>vehOn(v.key) && (v.key!=="none" || P.some(r=>r.veh==="none"&&MEASURED.has(r.st))));
  const data=new Map(vs.map(v=>[v.key,new Map(keys.map(k=>[k,0]))]));
  const cnt=new Map(vs.map(v=>[v.key,new Map(keys.map(k=>[k,0]))]));
  for(const r of P){ if(!MEASURED.has(r.st)||!data.has(r.veh)) continue; const k=bucketKey(r.date,g); if(!data.get(r.veh).has(k)) continue; data.get(r.veh).set(k,data.get(r.veh).get(k)+r.len); cnt.get(r.veh).set(k,cnt.get(r.veh).get(k)+1); }
  const ctx=sec.querySelector("canvas");
  const ink2=css("--ink-2"), grid=css("--grid"), muted=css("--muted");
  mountQ.push(()=>charts.push(new Chart(ctx,{type:"bar",data:{labels:keys.map(k=>bucketLabel(k,g)),
    datasets:vs.map(v=>({label:v.name,data:keys.map(k=>+(data.get(v.key).get(k)/1000).toFixed(1)),backgroundColor:css(v.color),borderRadius:4,borderSkipped:"bottom",borderColor:css("--surface"),borderWidth:{top:2,left:0,right:0,bottom:0},maxBarThickness:46,stack:"s"}))},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      plugins:{legend:{position:"top",align:"end",labels:{color:ink2,boxWidth:10,boxHeight:10,useBorderRadius:true,borderRadius:3}},
        tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${nf1.format(c.raw)} km`,footer:items=>"Totalt: "+nf1.format(items.reduce((a,i)=>a+i.raw,0))+" km"}}},
      scales:{x:{stacked:true,grid:{display:false},ticks:{color:muted,maxRotation:0,autoSkip:true}},y:{stacked:true,beginAtZero:true,suggestedMax:50,grid:{color:grid},border:{display:false},ticks:{color:muted,callback:v=>nf0.format(v)},title:{display:true,text:"km",color:muted}}}}})));
  // tabell
  const rowsK=keys.slice().reverse();
  let h=`<table><thead><tr><th>${g==="day"?"Datum":g==="week"?"Vecka":"Månad"}</th>${vs.map(v=>`<th class="n"><i class="sw" style="background:var(${v.color})"></i> ${esc(v.name)}</th>`).join("")}<th class="n">Totalt km</th><th class="n">Sträckor</th></tr></thead><tbody>`;
  let tot=new Map(vs.map(v=>[v.key,0])), tc=0;
  for(const k of rowsK){ let s=0,c=0; const cells=vs.map(v=>{ const x=data.get(v.key).get(k); s+=x; c+=cnt.get(v.key).get(k); tot.set(v.key,tot.get(v.key)+x); return `<td class="n">${x?km(x):'<span class="muted">–</span>'}</td>`; }).join(""); tc+=c;
    if(!s && g==="day") continue;
    h+=`<tr><td>${bucketLabel(k,g)}${g==="week"?` <span class="muted">${fmtDate(k)}</span>`:""}</td>${cells}<td class="n"><b>${km(s)}</b></td><td class="n">${c}</td></tr>`; }
  const T=[...tot.values()].reduce((a,b)=>a+b,0);
  h+=`<tr class="total"><td>Summa</td>${vs.map(v=>`<td class="n">${km(tot.get(v.key))}</td>`).join("")}<td class="n">${km(T)}</td><td class="n">${tc}</td></tr></tbody></table>`;
  sec.querySelector(".tbl-wrap").innerHTML=h;
  return sec;
}

function secVehicles(P,from,to){
  const T=todayStr();
  const sec=el(`<section><h2>Bilar<span class="h-sub">vald period · idag ${fmtDate(T)}</span></h2><div class="vgrid"></div></section>`);
  const g=sec.querySelector(".vgrid");
  const spDays=[]; for(let i=13;i>=0;i--) spDays.push(ymd(addDays(new Date(),-i)));
  for(const v of M.vlist){ if(!vehOn(v.key)) continue;
    const mine=P.filter(r=>r.veh===v.key); const m=mine.filter(r=>MEASURED.has(r.st));
    const all=M.rows.filter(r=>r.veh===v.key && r.date);
    if(v.key==="none" && !all.length) continue;
    const kmM=m.reduce((a,r)=>a+r.len,0); const vd=new Set(m.map(r=>r.date)).size;
    const dev=mine.filter(r=>r.st==="deviated").length;
    const lastM=all.filter(r=>MEASURED.has(r.st)).reduce((a,r)=>r.date>a?r.date:a,"");
    const today=all.filter(r=>r.date===T); const todayPlan=today.reduce((a,r)=>a+r.len,0); const todayDone=today.filter(r=>MEASURED.has(r.st)).reduce((a,r)=>a+r.len,0);
    const nextD=all.filter(r=>r.date>T && r.st==="planned").reduce((a,r)=>!a||r.date<a?r.date:a,"");
    const bestDay=(()=>{ const by=new Map(); for(const r of m){ by.set(r.date,(by.get(r.date)||0)+r.len); } let b=null; for(const [d,x] of by) if(!b||x>b[1]) b=[d,x]; return b; })();
    const sp=spDays.map(d=>all.filter(r=>r.date===d&&MEASURED.has(r.st)).reduce((a,r)=>a+r.len,0)); const mx=Math.max(1,...sp);
    const labels=[...new Set(today.map(r=>M.wdById.get(r.wd)?.day_label).filter(Boolean))].join(", ");
    g.append(el(`<div class="card vcard">
      <h3><i class="sw" style="background:var(${v.color})"></i>${esc(v.name)} <span class="reg">${esc(v.reg)}</span></h3>
      <div class="big">${km(kmM)} <small>km uppmätt</small></div>
      <div class="muted" style="font-size:12.5px">${vd} mätdagar · snitt ${vd?km(kmM/vd):"–"} km/dag</div>
      <dl>
        <dt>Idag</dt><dd>${today.length?`${km(todayDone)} / ${km(todayPlan)} km`:'<span class="muted">ingen plan</span>'}</dd>
        ${labels?`<dt>Dagens rutt</dt><dd style="white-space:normal">${esc(labels)}</dd>`:""}
        <dt>Uppmätta sträckor</dt><dd>${m.length}</dd>
        <dt>Avvikelser</dt><dd>${dev}</dd>
        <dt>Bästa dag</dt><dd>${bestDay?`${km(bestDay[1])} km · ${fmtDate(bestDay[0])}`:"–"}</dd>
        <dt>Senast mätt</dt><dd>${lastM?fmtDate(lastM):"–"}</dd>
        <dt>Nästa planerade dag</dt><dd>${nextD?fmtDate(nextD):"–"}</dd>
      </dl>
      <div class="spark" title="Uppmätta km senaste 14 dagarna" aria-label="Uppmätta km senaste 14 dagarna">${sp.map((x,i)=>`<i title="${fmtDate(spDays[i])}: ${km(x)} km" style="height:${Math.max(3,100*x/mx)}%;${x?`background:var(${v.color})`:""}"></i>`).join("")}</div>
      <div class="muted" style="font-size:11.5px;margin-top:3px">senaste 14 dagarna</div>
    </div>`));
  }
  return sec;
}

function orderName(i){ return i==null?"Okänd order":ORDERS[i].name; }

function secDayLog(P){
  const sec=el(`<section><h2>Dagslogg<span class="h-sub">klicka på en rad för att se sträckorna</span></h2><div class="tbl-wrap"></div></section>`);
  const byWd=new Map(); for(const r of P){ (byWd.get(r.wd)||byWd.set(r.wd,[]).get(r.wd)).push(r); }
  const list=[...byWd.entries()].map(([id,rs])=>({id,w:M.wdById.get(id),rs})).sort((a,b)=>b.w.date.localeCompare(a.w.date)||M.vehMap.get(a.rs[0].veh).name.localeCompare(M.vehMap.get(b.rs[0].veh).name,"sv",{numeric:true}));
  if(!list.length){ sec.querySelector(".tbl-wrap").innerHTML=`<div class="empty">Inga arbetsdagar i vald period.</div>`; return sec; }
  let h=`<table><thead><tr><th>Datum</th><th>Bil</th><th>Rutt</th><th>Län</th><th class="n">Uppmätt km</th><th class="n">Planerat km</th><th class="n">Sträckor</th><th class="n">Avvikelser</th><th>Status</th></tr></thead><tbody>`;
  for(const d of list){ const v=M.vehMap.get(d.rs[0].veh); const m=d.rs.filter(r=>MEASURED.has(r.st)); const dev=d.rs.filter(r=>r.st==="deviated");
    const lans=[...new Set(d.rs.map(r=>r.order!=null?LAN[ORDERS[r.order].lan]||ORDERS[r.order].lan:null).filter(Boolean))].join(", ");
    const pl=d.rs.reduce((a,r)=>a+r.len,0), mm=m.reduce((a,r)=>a+r.len,0);
    const st = mm>=pl&&pl>0?'<span class="badge b-measured">Klar</span>':mm>0?'<span class="badge b-open">Delvis</span>':'<span class="badge b-plan">Planerad</span>';
    h+=`<tr class="click" data-wd="${d.id}" tabindex="0" aria-expanded="false"><td>${fmtDate(d.w.date)}</td><td><i class="sw" style="background:var(${v.color})"></i> ${esc(v.name)}</td><td>${esc(d.w.day_label||"")}</td><td>${esc(lans)}</td><td class="n"><b>${km(mm)}</b></td><td class="n">${km(pl)}</td><td class="n">${m.length} / ${d.rs.length}</td><td class="n">${dev.length||'<span class="muted">0</span>'}</td><td>${st}</td></tr>`; }
  h+=`</tbody></table>`;
  const wrap=sec.querySelector(".tbl-wrap"); wrap.innerHTML=h;
  const toggle=tr=>{ const nx=tr.nextElementSibling; if(nx&&nx.classList.contains("detail")){ nx.remove(); tr.setAttribute("aria-expanded","false"); return; }
    const rs=byWd.get(tr.dataset.wd).slice().sort((a,b)=>a.seq-b.seq);
    const inner=`<div class="inner"><table><thead><tr><th>Sträcka</th><th>Order</th><th class="n">km</th><th>Status</th><th>Felkod / notering</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.sid)}${r.sc?' <span class="muted">(egenkontroll)</span>':""}</td><td>${esc(orderName(r.order))}</td><td class="n">${km(r.len)}</td><td><span class="badge ${MEASURED.has(r.st)?"b-measured":r.st==="deviated"?"b-dev":"b-plan"}">${esc(STATUS_LBL[r.st]||r.st)}</span></td><td>${esc([r.fault?.label,r.note].filter(Boolean).join(" · "))}</td></tr>`).join("")}</tbody></table></div>`;
    const d=document.createElement("tr"); d.className="detail"; d.innerHTML=`<td colspan="9">${inner}</td>`; tr.after(d); tr.setAttribute("aria-expanded","true"); };
  wrap.querySelectorAll("tr.click").forEach(tr=>{ tr.onclick=()=>toggle(tr); tr.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(tr); } }; });
  return sec;
}

function secOrders(P){
  const onlyOpen = recall("onlyOpen",false);
  const sec=el(`<section><div class="toolbar"><h2>Orderframsteg<span class="h-sub">per län och beställning · hela säsongen</span></h2>
    <label class="ink2" style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" ${onlyOpen?"checked":""}> Dölj färdiga order</label></div><div></div></section>`);
  sec.querySelector("input").onchange=e=>{ store("onlyOpen",e.target.checked); render(); };
  const periodBy=new Map(); const seen=new Set();
  for(const r of P){ if(!MEASURED.has(r.st)||r.order==null||r.sc||seen.has(r.sid)) continue; const a=M.segAgg.get(r.sid); if(a.mDate!==r.date) continue; seen.add(r.sid); periodBy.set(r.order,(periodBy.get(r.order)||0)+a.len); }
  const byLan=new Map(); for(const s of M.ordStats){ (byLan.get(s.o.lan)||byLan.set(s.o.lan,[]).get(s.o.lan)).push(s); }
  const lanList=[...byLan.entries()].map(([lan,ss])=>({lan,name:LAN[lan]||("Län "+lan),ss,tot:ss.reduce((a,s)=>a+s.o.total,0),meas:ss.reduce((a,s)=>a+Math.min(s.meas,s.o.total),0)})).sort((a,b)=>a.name.localeCompare(b.name,"sv"));
  const box=sec.lastElementChild;
  for(const L of lanList){
    const ss=L.ss.slice().sort((a,b)=>(a.o.km-b.o.km)||a.o.name.localeCompare(b.o.name,"sv")).filter(s=>!onlyOpen||s.meas<s.o.total-1);
    if(!ss.length) continue;
    const pm=100*L.meas/L.tot;
    let h=`<div class="card ord-county" style="padding:0"><div class="chead"><span>${esc(L.name)}</span><span class="fig">${km(L.meas)} / ${km(L.tot)} km · ${pct(L.meas,L.tot)}</span></div><div>`;
    for(const s of ss){ const m=Math.min(s.meas,s.o.total), t=s.o.total, rem=Math.max(0,t-m);
      const sch=Math.min(s.scheduled,rem), pp=periodBy.get(s.o.i)||0;
      h+=`<div class="prow"><div class="nm" title="${esc(s.o.name)}">${esc(s.o.name)}${s.o.km?'<span class="tag">KM</span>':""}</div>
        <div class="fig"><b>${km(m)}</b> <span>/ ${km(t)} km</span> · <b>${pct(m,t)}</b>${pp?` <span>(+${km(pp)} i perioden)</span>`:""}</div>
        <div class="pbar" role="img" aria-label="${pct(m,t)} uppmätt"><i style="width:${100*m/t}%;background:var(--good)"></i><i style="width:${100*sch/t}%;background:var(--accent);opacity:.45"></i></div></div>`; }
    h+=`</div></div>`; box.append(el(h));
  }
  box.prepend(el(`<div class="legend" style="margin-bottom:10px"><span><i class="sw" style="background:var(--good)"></i>Uppmätt</span><span><i class="sw" style="background:var(--accent);opacity:.45"></i>Inplanerat med datum</span><span><i class="sw" style="background:var(--track)"></i>Kvar utan datum</span></div>`));
  return sec;
}

function secDeviations(P){
  const dev=P.filter(r=>r.st==="deviated");
  const sec=el(`<section><h2>Avvikelser<span class="h-sub">vald period</span></h2><div class="two"><div class="card"></div><div class="tbl-wrap"></div></div></section>`);
  const [c1,c2]=sec.querySelectorAll(".two > div");
  if(!dev.length){ sec.querySelector(".two").outerHTML=`<div class="card"><div class="empty">Inga avvikelser i perioden.</div></div>`; return sec; }
  const by=new Map(); for(const r of dev){ const k=r.fault?r.fault.label:"Ingen felkod"; const a=by.get(k)||{n:0,len:0}; a.n++; a.len+=r.len; by.set(k,a); }
  const arr=[...by.entries()].sort((a,b)=>b[1].n-a[1].n); const mx=arr[0][1].n;
  c1.innerHTML=`<div class="ink2" style="font-size:12.5px;margin-bottom:6px">Antal per felkod</div>`+arr.map(([k,a])=>`<div class="hbar"><span>${esc(k)}</span><span class="tr"><i style="width:${100*a.n/mx}%"></i></span><span class="n" style="text-align:right">${a.n} <span class="muted">· ${km0(a.len)} km</span></span></div>`).join("");
  const sorted=dev.slice().sort((a,b)=>b.date.localeCompare(a.date));
  c2.innerHTML=`<table><thead><tr><th>Datum</th><th>Bil</th><th>Sträcka</th><th class="n">km</th><th>Felkod</th><th>Läge</th></tr></thead><tbody>${sorted.slice(0,200).map(r=>{ const a=M.segAgg.get(r.sid); return `<tr><td>${fmtDate(r.date)}</td><td>${esc(M.vehMap.get(r.veh).name)}</td><td title="${esc(orderName(r.order))}${r.note?" · "+esc(r.note):""}">${esc(r.sid)}</td><td class="n">${km(r.len)}</td><td>${esc(r.fault?.label||"–")}</td><td>${a.measured?'<span class="badge b-fixed">Ommätt</span>':a.pDate?`<span class="badge b-open">Omplanerad ${fmtDate(a.pDate)}</span>`:'<span class="badge b-dev">Öppen</span>'}</td></tr>`; }).join("")}</tbody></table>`;
  return sec;
}

function secAhead(){
  const T=todayStr(); const end=ymd(addDays(new Date(),13));
  const rs=M.rows.filter(r=>r.date&&r.date>=T&&r.date<=end&&r.st==="planned"&&vehOn(r.veh));
  const sec=el(`<section><h2>Planerat framåt<span class="h-sub">ej uppmätta sträckor kommande 14 dagar</span></h2><div class="tbl-wrap"></div></section>`);
  if(!rs.length){ sec.querySelector(".tbl-wrap").innerHTML=`<div class="empty">Inget planerat de kommande 14 dagarna.</div>`; return sec; }
  const vs=M.vlist.filter(v=>vehOn(v.key)&&rs.some(r=>r.veh===v.key));
  const dates=[...new Set(rs.map(r=>r.date))].sort();
  const cell=(d,v)=>{ const x=rs.filter(r=>r.date===d&&r.veh===v.key); if(!x.length) return `<td class="muted">–</td>`; const lbl=[...new Set(x.map(r=>M.wdById.get(r.wd)?.day_label).filter(Boolean))].join(", ");
    return `<td><b>${km(x.reduce((a,r)=>a+r.len,0))} km</b> <span class="muted" style="font-size:12px">${esc(lbl)}</span></td>`; };
  sec.querySelector(".tbl-wrap").innerHTML=`<table><thead><tr><th>Datum</th>${vs.map(v=>`<th><i class="sw" style="background:var(${v.color})"></i> ${esc(v.name)}</th>`).join("")}<th class="n">Totalt</th></tr></thead><tbody>${dates.map(d=>`<tr><td>${fmtDate(d)}</td>${vs.map(v=>cell(d,v)).join("")}<td class="n">${km(rs.filter(r=>r.date===d).reduce((a,r)=>a+r.len,0))}</td></tr>`).join("")}</tbody></table>`;
  return sec;
}

function secReplan(from,to){
  const rs=RAW.replan.filter(r=>{ const d=(r.created_at||"").slice(0,10); return d>=from&&d<=to; });
  const sec=el(`<section><h2>Återställda sträckor<span class="h-sub">replan_history · vald period</span></h2><div class="tbl-wrap"></div></section>`);
  sec.querySelector(".tbl-wrap").innerHTML = rs.length?`<table><thead><tr><th>Återställd</th><th>Mätsträcka</th><th>Tidigare status</th><th>Ursprungligt mätdatum</th><th>Orsak</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc((r.created_at||"").slice(0,16).replace("T"," "))}</td><td>${esc(r.matstracka_id||r.segment_id)}</td><td>${esc(STATUS_LBL[r.previous_status]||r.previous_status||"")}</td><td>${r.original_driven_date?fmtDate(String(r.original_driven_date).slice(0,10)):"–"}</td><td style="white-space:normal">${esc(r.reason||"")}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">Inga återställningar i perioden.</div>`;
  return sec;
}

// ───────────────────────── Live: realtime + polling ─────────────────────────
let rtState="off", debounceT=null;
function setLive(){
  const e=$("#liveState");
  if(loading && !M){ e.innerHTML=`<span class="dot"></span>Hämtar…`; return; }
  if(loadErr && !M){ e.innerHTML=`<span class="dot err"></span>Fel vid hämtning`; return; }
  e.innerHTML = rtState==="on"?`<span class="dot on"></span>Live`:`<span class="dot"></span>Uppdateras var ${CFG.pollMinutes}:e minut`;
  $("#updated").textContent = loading?"Uppdaterar…":lastLoad?"Senast "+lastLoad.toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";
}
function scheduleReload(){ clearTimeout(debounceT); debounceT=setTimeout(loadAll,CFG.realtimeDebounceMs); }
function startRealtime(){
  try{
    if(!window.supabase||!window.supabase.createClient) return;
    const sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false}});
    sb.channel("uppfoljning").on("postgres_changes",{event:"*",schema:"public",table:"work_day_segments"},scheduleReload)
      .on("postgres_changes",{event:"*",schema:"public",table:"work_days"},scheduleReload)
      .subscribe(st=>{ rtState = st==="SUBSCRIBED"?"on":"off"; setLive(); });
  }catch(e){ console.warn("Realtime ej tillgängligt",e); }
}
$("#refreshBtn").onclick=()=>loadAll();
setInterval(()=>{ if(!document.hidden) loadAll(); }, CFG.pollMinutes*60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && lastLoad && Date.now()-lastLoad>60000) loadAll(); });
// rita om vid dygnsbyte så "Idag" stämmer
let dayNow=todayStr(); setInterval(()=>{ if(todayStr()!==dayNow){ dayNow=todayStr(); render(); } },60000);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());

buildFilters();
loadAll().then(()=>{ buildFilters(); render(); });
startRealtime();
})();
</script>
